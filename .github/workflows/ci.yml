name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corvin
          POSTGRES_PASSWORD: corvin
          POSTGRES_DB: corvin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corvin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORVIN_TEST_DATABASE_URL: postgresql+psycopg://corvin:corvin@localhost:5432/corvin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t corvin:ci .
