[project]
name = "corvin"
version = "0.2.0"
description = "Compliance-aware incident-response orchestrator: DORA / NIS2 / GDPR classification, deadline clocks, grounded draft notifications, tamper-evident audit trail."
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Form() in argument defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
