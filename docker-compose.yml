services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: corvin
      POSTGRES_PASSWORD: corvin
      POSTGRES_DB: corvin
    volumes:
      - corvin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvin"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://corvin:corvin@db:5432/corvin
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  corvin_pgdata:
